<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Flashcards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* 翻转卡片核心样式 */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .flip-card-front {
            background-color: #ffffff;
            color: #333;
        }

        .flip-card-back {
            background-color: #fff9f9;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #ffcdd2;
        }

        /* 自定义图片样式 */
        .card-img-display {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #888;
        }

        /* 发音按钮 */
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .audio-btn:hover {
            background-color: #ffebee;
        }

        @media (min-width: 768px) {
            .flip-card {
                height: 200px;
            }
            .card-img-display {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="flashcard-list" class="card-grid"></div>
</div>

<script>
    // 词汇数据列表
    const pronounsList = [
        { 
            word: "我", 
            pinyin: "wǒ", 
            imgSrc: "Lesson 1/wo.png"  // 指向 Lesson 1 文件夹下的 wo.png
        },
        { 
            word: "你", 
            pinyin: "nǐ", 
            imgSrc: "" // 后续有其他图片可以直接填入路径，如 "Lesson 1/ni.png"
        }
    ];

    // 渲染卡片 HTML 函数
    function generateImgCardsHTML(dataList) {
        return dataList.map(item => {
            // 判断是否有图片路径，有则显示 <img>，无则显示默认占位文字
            const imageHTML = item.imgSrc 
                ? `<img src="${item.imgSrc}" alt="${item.word}" class="card-img-display" />`
                : `<div style="font-size: 2rem; margin-bottom: 8px;">❓</div>`;

            const frontContent = `
                ${imageHTML}
                <div class="hint-text">(${item.pinyin})</div>
            `;

            return `
                <div class="flip-card" onclick="toggleFlip(this)">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            ${frontContent}
                        </div>
                        <div class="flip-card-back">
                            <div class="chinese-word" style="font-size: 2rem; margin-bottom: 0.5rem; font-weight: bold; color: #d32f2f;">${item.word}</div>
                            <div class="pinyin-word" style="font-size: 1rem; margin-bottom: 0.8rem; color: #666;">(${item.pinyin})</div>
                            <button class="audio-btn" onclick="event.stopPropagation(); speakChinese('${item.word}')" title="朗读">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="#d32f2f"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 翻转卡片
    function toggleFlip(element) {
        element.classList.toggle('flipped');
    }

    // 语音朗读
    function speakChinese(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.speak(utterance);
        }
    }

    // 页面加载完成后渲染卡片
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("flashcard-list");
        if (container) {
            container.innerHTML = generateImgCardsHTML(pronounsList);
        }
    });
</script>

</body>
</html>
